services:
    db:
        image: mariadb:10.11
        container_name: h-nine-n-mariadb
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        ports:
            - '3306:3306'
        volumes:
            - mariadb_data:/var/lib/mysql
        command: >
            mysqld
            --innodb-buffer-pool-size=256M
            --max-connections=50
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_general_ci
            --innodb-ft-min-token-size=2
        mem_limit: 512m
        networks:
            - h-nine-n

    redis:
        image: redis:6-alpine
        container_name: h-nine-n-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
        mem_limit: 256m
        networks:
            - h-nine-n

volumes:
    mariadb_data:
    redis_data:

networks:
    h-nine-n:
        driver: bridge
